<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeux entre potes</title>
<meta name="description" content="Jeux de soirée à jouer entre potes sur un seul téléphone.">
<meta name="theme-color" content="#15203A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Entre potes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
</head>
<body>
<main class="sheet wide">
  <header class="head">
    <div class="brand">Longue vie<br><em>à Netanyahu</em></div>
    <div class="head-r"><span id="snd"></span></div>
  </header>
  <section class="games" id="games" aria-label="Jeux"></section>
</main>
<script src="assets/js/catalogue.js"></script>
<script src="assets/js/fx.js"></script>
<script>
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // Illustrations animées des cartes (couleurs via les tokens du thème).
  const ART = {
    quiz: `<svg viewBox="0 0 320 180" aria-hidden="true">
      <g class="bob" style="--d:0s"><path d="M38 38h104a16 16 0 0 1 16 16v38a16 16 0 0 1-16 16H82l-22 18v-18H38a16 16 0 0 1-16-16V54a16 16 0 0 1 16-16z" fill="var(--card)"/><text x="90" y="88" text-anchor="middle" font-family="var(--f-display)" font-weight="800" font-size="40" fill="var(--ink)">?</text></g>
      <g class="bob" style="--d:-1.2s"><path d="M178 70h104a16 16 0 0 1 16 16v38a16 16 0 0 1-16 16h-22v18l-22-18h-60a16 16 0 0 1-16-16V86a16 16 0 0 1 16-16z" fill="var(--stamp)"/><text x="230" y="120" text-anchor="middle" font-family="var(--f-display)" font-weight="800" font-size="40" fill="var(--stamp-ink)">?!</text></g>
      <g class="bob" style="--d:-2.1s"><circle cx="160" cy="34" r="10" fill="var(--mark)"/><circle cx="276" cy="42" r="6" fill="var(--card)"/><circle cx="58" cy="150" r="7" fill="var(--stamp)"/></g>
    </svg>`,
    undercover: `<svg viewBox="0 0 320 180" aria-hidden="true">
      <g class="sway" style="--r:-14deg;--d:0s"><rect x="78" y="34" width="76" height="108" rx="10" fill="var(--paper)"/><path d="M94 66h44M94 80h30" stroke="var(--muted)" stroke-width="6" stroke-linecap="round"/></g>
      <g class="sway" style="--r:0deg;--d:-.8s"><rect x="122" y="26" width="76" height="108" rx="10" fill="var(--paper)"/><path d="M138 58h44M138 72h30" stroke="var(--muted)" stroke-width="6" stroke-linecap="round"/></g>
      <g class="sway" style="--r:14deg;--d:-1.6s"><rect x="166" y="34" width="76" height="108" rx="10" fill="var(--stamp)"/><text x="204" y="104" text-anchor="middle" font-family="var(--f-display)" font-weight="800" font-size="46" fill="var(--stamp-ink)">≠</text></g>
      <g class="bob" style="--d:-.6s"><path d="M236 128c10-8 26-8 36 0 8 7 22 7 30 0 0 18-12 30-26 30-6 0-10-3-12-6-2 3-6 6-12 6-14 0-26-12-26-30 4 3 7 3 10 0z" fill="var(--mark)"/><ellipse cx="258" cy="140" rx="7" ry="5" fill="var(--ink)"/><ellipse cx="286" cy="140" rx="7" ry="5" fill="var(--ink)"/></g>
    </svg>`,
    dessin: `<svg viewBox="0 0 320 180" aria-hidden="true">
      <rect x="70" y="18" width="180" height="134" rx="8" fill="#FFFFFF"/>
      <path class="scribble" pathLength="1" d="M96 120c18-40 34-62 52-60s14 40 30 42 22-50 40-52 10 46 18 58" fill="none" stroke="var(--stamp)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="scribble s2" pathLength="1" d="M104 56c20 6 44 4 62-2" fill="none" stroke="#2E86AB" stroke-width="6" stroke-linecap="round"/>
      <path d="M100 152l-14 24M220 152l14 24M160 152v24" stroke="var(--mark)" stroke-width="7" stroke-linecap="round"/>
      <g class="bob" style="--d:-.4s"><g transform="rotate(35 262 70)"><rect x="252" y="20" width="20" height="88" rx="4" fill="var(--mark)"/><path d="M252 108h20l-10 22z" fill="#F2D3A8"/><path d="M258 122h8l-4 8z" fill="var(--ink)"/><rect x="252" y="20" width="20" height="14" rx="4" fill="var(--stamp)"/></g></g>
    </svg>`
  };
  const PEOPLE = `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5z"/><circle cx="17" cy="9" r="2.8"/><path d="M15.5 13.6c4 0 6.5 2.3 6.5 5.9h-4.5c0-2.3-.7-4.3-2-5.9z"/></svg>`;
  const CLOCK = `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 7v5l3.5 2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`;
  const ongoing = key => { try { const s = JSON.parse(localStorage.getItem(key) || "null"); return !!(s && s.g && s.screen && s.screen !== "result" && s.screen !== "setup"); } catch (e) { return false; } };
  document.getElementById("games").innerHTML = GAMES.map((g, i) => {
    const live = g.save && ongoing(g.save);
    return `<a class="game game-${g.art}" href="${esc(g.path)}" style="--i:${i}">
      <div class="art">${ART[g.art] || ""}${live ? `<span class="live">Partie en cours</span>` : ""}</div>
      <div class="game-body">
        <h2>${esc(g.title)}</h2>
        <p>${esc(g.pitch)}</p>
        <div class="meta"><span>${PEOPLE}${esc(g.players)}</span><span>${CLOCK}${esc(g.time)}</span><span class="play">${live ? "Reprendre" : "Jouer"}</span></div>
      </div>
    </a>`;
  }).join("");
  document.getElementById("games").addEventListener("click", e => { if (e.target.closest(".game")) { fx.buzz(10); fx.sound("tick"); } });
  document.getElementById("snd").outerHTML = fx.soundButton();
</script>
<script src="assets/js/pwa.js"></script>
</body>
</html>
